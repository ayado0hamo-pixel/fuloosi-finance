<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استعادة كلمة المرور | فلوسي</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#17202a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 14px 45px #17202a18}h1{margin:0 0 8px;color:#176b55}p{color:#65727e;line-height:1.7}label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;padding:14px;border:1px solid #ccd6df;border-radius:12px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#176b55;color:#fff;font-size:16px;font-weight:800}button:disabled{opacity:.55}.status{margin-top:16px;padding:12px;border-radius:10px;background:#eef6f3;color:#176b55}.error{background:#fff0f0;color:#a52828}.hide{display:none}a{color:#176b55}
  </style>
</head>
<body>
  <main class="card">
    <h1>💸 تعيين كلمة مرور جديدة</h1>
    <p>اكتب كلمة مرور جديدة لحسابك في فلوسي. لازم تكون 12 حرفاً على الأقل.</p>
    <form id="form" class="hide">
      <label for="password">كلمة المرور الجديدة</label>
      <input id="password" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirm">تأكيد كلمة المرور</label>
      <input id="confirm" type="password" minlength="12" autocomplete="new-password" required>
      <button id="submit" type="submit">تغيير كلمة المرور</button>
    </form>
    <div id="status" class="status">جاري التحقق من رابط الاستعادة…</div>
    <p><a href="./">الرجوع إلى فلوسي</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=20261111-3"></script>
  <script>
    'use strict';
    const statusBox=document.getElementById('status');
    const form=document.getElementById('form');
    const client=window.supabase.createClient(window.FULOOSI_CONFIG.url,window.FULOOSI_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
    function ready(session){if(!session)return;form.classList.remove('hide');statusBox.textContent='الرابط صحيح. اكتب كلمة المرور الجديدة.';}
    client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN'||event==='INITIAL_SESSION')ready(session);});
    client.auth.getSession().then(({data,error})=>{if(error){statusBox.textContent=error.message;statusBox.classList.add('error');return}if(data.session)ready(data.session);else setTimeout(()=>{if(form.classList.contains('hide')){statusBox.textContent='رابط الاستعادة غير صالح أو انتهت صلاحيته. ارجع إلى فلوسي واطلب رابطاً جديداً.';statusBox.classList.add('error')}},1800)});
    form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;if(password.length<12){statusBox.textContent='استخدم 12 حرفاً على الأقل.';statusBox.classList.add('error');return}if(password!==confirm){statusBox.textContent='كلمتا المرور غير متطابقتين.';statusBox.classList.add('error');return}document.getElementById('submit').disabled=true;const{error}=await client.auth.updateUser({password});if(error){statusBox.textContent=error.message;statusBox.classList.add('error');document.getElementById('submit').disabled=false;return}statusBox.textContent='تم تغيير كلمة المرور بنجاح. تقدر ترجع وتسجل دخولك.';statusBox.classList.remove('error');form.classList.add('hide');await client.auth.signOut();});
  </script>
</body>
</html>
